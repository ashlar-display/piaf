[package]
name = "piaf"
version = "0.4.2"
edition = "2024"
rust-version = "1.85"
description = "A library for reading and interpreting display capability data (EDID)."
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/piaf"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "edid", "displayid"]
categories = ["hardware-support", "embedded", "parser-implementations"]

[features]
default = ["std"]
std = ["alloc", "display-types/std"]
alloc = ["display-types/alloc"]
serde = ["dep:serde", "bitflags/serde", "display-types/serde"]

[dependencies]
display-types = { version = "0.4.0", default-features = false }
serde = { version = "1.0", optional = true, features = ["derive"] }
bitflags = "2.4"
thiserror = { version = "2.0", default-features = false }

[dev-dependencies]
serde_json = { version = "1.0", optional = false }

# Until display-types 0.5 is released (`VideoMode::h_blank`, `HdmiAudioBlock`); remove before release.
[patch.crates-io]
display-types = { path = "../display-types" }
