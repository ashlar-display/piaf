name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Dispatched by release-tag.yml: tags pushed with GITHUB_TOKEN do not trigger
  # push workflows. Only tag refs proceed; see the check-branch guard below.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-branch:
    name: Check tag is on main
    # A dispatch against a branch (e.g. main) must not publish or create a release.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main
        id: check
        run: |
          git fetch origin main
          if git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag is not on main — skipping publish."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check tag matches the crate version
        run: |
          CRATE_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CRATE_VERSION}."
            exit 1
          fi

  # Quality gates. This job compiles the crate and its dependencies (running their
  # build scripts), so it holds no publishing credentials and may use the cache.
  verify:
    name: Verify
    needs: check-branch
    if: needs.check-branch.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Docs
        run: cargo rustdoc --locked -- -D missing_docs

      - name: Test (std)
        run: cargo test --locked

      - name: Test (std + serde)
        run: cargo test --locked --features serde

      - name: Build (alloc only)
        run: cargo build --locked --no-default-features --features alloc

      - name: Build (no_std)
        run: cargo build --locked --no-default-features

  # What is about to be released, shown on the run page while the publish job
  # waits for approval in the `release` environment. Packages the crate the same
  # way the publish job does (compiling nothing, holding no credentials) so the
  # approver sees the exact sha256 that will be uploaded.
  summary:
    name: Release summary
    needs: check-branch
    if: needs.check-branch.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    outputs:
      crate_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # previous release tag and history for the comparison
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Package crate
        id: package
        run: |
          cargo package --locked --no-verify
          CRATE_FILE=$(ls target/package/*.crate)
          echo "file=$(basename "$CRATE_FILE")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$CRATE_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write release summary
        env:
          CRATE_FILE: ${{ steps.package.outputs.file }}
          CRATE_SHA256: ${{ steps.package.outputs.sha256 }}
          CRATES_IO_UA: ${{ github.repository }} publish workflow (https://github.com/${{ github.repository }})
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(git rev-parse HEAD)
          REPO_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          # Baseline: the highest strict vX.Y.Z tag reachable from HEAD that sorts below
          # this release. Pre-release or malformed tags (v1.2.3-rc.1, v1.2.3.4) are ignored.
          PREV=$( { git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'; \
                    echo "$GITHUB_REF_NAME"; } \
            | sort -uV | awk -v cur="$GITHUB_REF_NAME" '$0 == cur { print prev; exit } { prev = $0 }')
          if [ -n "$PREV" ]; then
            PREV_INFO=$(git log -1 --format='%h, %cs' "$PREV")
            PREV_STATUS=$(curl -sS -A "$CRATES_IO_UA" -o /dev/null -w '%{http_code}' \
              "https://crates.io/api/v1/crates/$NAME/${PREV#v}" || echo 000)
          fi
          {
            echo "## ${NAME} ${GITHUB_REF_NAME}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Crate | \`${NAME}\` ${VERSION} |"
            echo "| Commit | [\`${SHA:0:12}\`](${REPO_URL}/commit/${SHA}) |"
            if [ -n "$PREV" ]; then
              echo "| Since ${PREV} (${PREV_INFO}) | [compare](${REPO_URL}/compare/${PREV}...${GITHUB_REF_NAME}), $(git rev-list --count "${PREV}..HEAD") commits |"
            else
              echo "| Since | no previous release tag found |"
            fi
            echo "| Package | \`${CRATE_FILE}\` |"
            echo "| sha256 | \`${CRATE_SHA256}\` |"
            echo
            if [ -n "$PREV" ] && [ "$PREV_STATUS" != 200 ]; then
              echo "> [!CAUTION]"
              echo "> Baseline ${PREV} is not a published version on crates.io (HTTP ${PREV_STATUS}). It may be a stray or failed release tag; compare against the last published version instead."
              echo
            fi
            # Files that control what this pipeline runs or how the crate is built.
            WATCHED=(.github .cargo rust-toolchain rust-toolchain.toml build.rs)
            if [ -n "$PREV" ] && ! git diff --quiet "$PREV" HEAD -- "${WATCHED[@]}"; then
              echo "> [!WARNING]"
              echo "> Workflow, toolchain or build configuration changed since ${PREV}. These files control what runs in this release; review them in the compare diff."
              echo
              echo '```'
              git diff --stat "$PREV" HEAD -- "${WATCHED[@]}"
              echo '```'
              echo
            fi
            if [ -n "$PREV" ] && ! git diff --quiet "$PREV" HEAD -- Cargo.toml Cargo.lock; then
              echo "Manifest changes since ${PREV} (the version bump is expected; check for dependency changes):"
              echo
              echo '```'
              git diff --stat "$PREV" HEAD -- Cargo.toml Cargo.lock
              echo '```'
              echo
            fi
            echo "Reproduce the package hash locally: \`git checkout ${GITHUB_REF_NAME} && cargo package --locked --no-verify && sha256sum target/package/${CRATE_FILE}\`"
            echo
            echo "_This summary is generated by the workflow being approved. It does not replace reviewing the compare diff._"
            echo
            echo "### Changelog"
            echo
            SECTION=$(awk -v hdr="## [${VERSION}]" 'index($0, hdr) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md)
            if [ -n "$(echo "$SECTION" | tr -d '[:space:]')" ]; then
              echo "$SECTION"
            else
              echo "_No \`## [${VERSION}]\` section found in CHANGELOG.md._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Packaging, attestation and upload. Runs in the `release` environment (deployable
  # only from v* tags), which crates.io trusted publishing is bound to. Nothing is
  # compiled here and no cache is restored, so no third-party build code runs while
  # the OIDC / crates.io token is available.
  publish:
    name: Publish to crates.io
    needs: [check-branch, verify, summary]
    if: needs.check-branch.outputs.on_main == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      # crates.io's data access policy requires an identifying User-Agent and
      # answers curl's default one with 403.
      CRATES_IO_UA: ${{ github.repository }} publish workflow (https://github.com/${{ github.repository }})
    permissions:
      id-token: write      # OIDC: SLSA provenance signing and crates.io trusted publishing
      attestations: write  # write signed provenance to GitHub's attestation store
      contents: write      # create GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Materialise the .crate package before signing. --no-verify skips the
      # verification build (already done by the verify job), so no dependency
      # build scripts run in this job. `cargo publish` re-packages into
      # target/package/, so the attested file is kept as a separate copy outside
      # the package root; that copy is what gets attested, compared against
      # crates.io, and attached to the GitHub release.
      - name: Package crate
        run: |
          cargo package --locked --no-verify
          mkdir -p "$RUNNER_TEMP/dist"
          cp target/package/*.crate "$RUNNER_TEMP/dist/"

      # The approver reviewed the sha256 shown by the summary job. Refuse to attest a
      # different package. (`cargo publish` re-packages for the upload; the checksum
      # step after it verifies that crates.io received the same bytes.)
      - name: Check package matches the release summary
        env:
          REVIEWED_SHA256: ${{ needs.summary.outputs.crate_sha256 }}
        run: |
          ACTUAL=$(sha256sum "$RUNNER_TEMP"/dist/*.crate | cut -d' ' -f1)
          if [ -z "$REVIEWED_SHA256" ] || [ "$ACTUAL" != "$REVIEWED_SHA256" ]; then
            echo "::error::Package sha256 $ACTUAL does not match the reviewed summary (${REVIEWED_SHA256:-missing})."
            exit 1
          fi
          echo "Package matches the reviewed summary: $ACTUAL"

      # Sign the .crate with SLSA Build Level 2 provenance.  The attestation
      # is stored in GitHub's attestation API and is verifiable offline with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest crate provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*.crate

      - name: Check whether this version is already on crates.io
        id: existing
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          STATUS=$(curl -sS -A "$CRATES_IO_UA" -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/$NAME/$VERSION")
          case "$STATUS" in
            200 )
              echo "$NAME $VERSION is already on crates.io — skipping upload."
              echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404 )
              echo "published=false" >> "$GITHUB_OUTPUT" ;;
            * )
              echo "::error::Unexpected HTTP $STATUS from crates.io while checking $NAME $VERSION."
              exit 1 ;;
          esac

      # Short-lived token via crates.io trusted publishing (OIDC); revoked
      # automatically when the job ends. No long-lived registry token is used.
      - name: Authenticate with crates.io
        if: steps.existing.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: steps.existing.outputs.published != 'true'
        run: cargo publish --locked --no-verify  # quality gates ran in the verify job
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # Fail loudly if what crates.io serves is not byte-identical to the attested
      # copy (e.g. a version uploaded outside CI).
      - name: Verify crates.io checksum matches the attested package
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          LOCAL=$(sha256sum "$RUNNER_TEMP"/dist/*.crate | cut -d' ' -f1)
          REMOTE=$(curl -fsS -A "$CRATES_IO_UA" "https://crates.io/api/v1/crates/$NAME/$VERSION" \
            | jq -er '.version.checksum')
          echo "attested: $LOCAL"
          echo "crates.io: $REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::crates.io checksum for $NAME $VERSION does not match the attested package."
            exit 1
          fi

      # Attach the signed .crate to a GitHub release so users can download
      # and verify it independently of crates.io.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          CRATE_FILE=$(ls "$RUNNER_TEMP"/dist/*.crate)
          CRATE_BASENAME=$(basename "$CRATE_FILE")

          cat > /tmp/release-notes.md <<NOTES
          ## Provenance verification

          The \`.crate\` package below was built and attested with
          [SLSA Build Level 2](https://slsa.dev) provenance during this
          GitHub Actions run.  Verify with the
          [GitHub CLI](https://cli.github.com/):

          \`\`\`sh
          gh attestation verify ${CRATE_BASENAME} --repo ${{ github.repository }}
          \`\`\`

          The same package is published to
          [crates.io/crates/${NAME}/${VER}](https://crates.io/crates/${NAME}/${VER}).
          NOTES

          # Re-runs after a partial failure: keep an existing release and only make
          # sure the attested package is attached.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading the attested package to it."
            gh release upload "$TAG" "$CRATE_FILE" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file /tmp/release-notes.md \
              "$CRATE_FILE"
          fi
