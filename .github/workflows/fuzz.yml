name: Fuzz

on:
  push:
    branches: [main, develop]
  # Not main: the only PRs into main are release-tag's release-promote/* PRs,
  # whose content already passed the fuzz smoke run on develop. Opened by
  # github-actions[bot], their runs would be held for approval and end as
  # action_required/failure.
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 2 * * 6'  # weekly, Saturday 02:00 UTC
  workflow_dispatch:       # allow manual trigger

# Read-only: the job only reads the repository and uploads crash artifacts.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_edid, capabilities_static]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly

      # Not in install-action's checksum-verified manifests; a fixed version built
      # from crates.io with its own lock file instead.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Restore corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz (smoke, 60 s) — PRs and pushes
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60

      - name: Fuzz (deep, 1 h) — scheduled and manual
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=3600

      - name: Minimise corpus
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: cargo +nightly fuzz cmin ${{ matrix.target }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
