name: CI

on:
  push:
    branches: [main, develop]
  # Not main: the only PRs into main are release-tag's release-promote/* PRs,
  # whose content already passed CI on develop. Opened by github-actions[bot],
  # their runs would be held for approval and end as action_required/failure.
  pull_request:
    branches: [develop]

# Read-only by default; the coverage job widens its own permissions to open its PR.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: No [patch] on main
        # A [patch] points a dependency at unreleased code for a prototype; cargo package
        # drops it, so a release built with one would not build from crates.io.
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -q '^\[patch' Cargo.toml; then
            echo "::error::Cargo.toml has a [patch] section; remove it before release"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Clippy (alloc only)
        run: cargo clippy --locked --all-targets --no-default-features --features alloc -- -D warnings

      - name: Clippy (serde)
        run: cargo clippy --locked --all-targets --features serde -- -D warnings

      # docs.rs builds with every feature, so the docs are checked the same way.
      - name: Docs
        run: cargo rustdoc --locked --all-features -- -D warnings

      - name: Test (std)
        run: cargo test --locked

      - name: Test (std + serde)
        run: cargo test --locked --features serde

      - name: Test (alloc only)
        run: cargo test --locked --no-default-features --features alloc

      # The integration tests and examples declare that they need `alloc`, so Cargo skips
      # them here; the library's own tests cover the bare `no_std` paths (the static
      # pipeline without `BaseBlockHandler`), and the doctests run too.
      - name: Test (no default features)
        run: cargo test --locked --no-default-features

      - name: Build (alloc only)
        run: cargo build --locked --no-default-features --features alloc --target thumbv7em-none-eabi

      - name: Build (no_std)
        run: cargo build --locked --no-default-features --target thumbv7em-none-eabi

  # cargo-msrv reads the MSRV from Cargo.toml's rust-version and runs the checks on that
  # toolchain. Built from crates.io with --locked at a pinned version, not install-action:
  # it has no manifest for cargo-msrv and would fall back to an unpinned cargo-binstall
  # download. Dependabot does not bump CARGO_MSRV_VERSION; bump it by hand.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      CARGO_MSRV_VERSION: 0.19.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restore and save are separate steps so the binary is cached as soon as it is
      # built: a combined cache step saves only when the whole job succeeds, so while the
      # MSRV is broken every run would rebuild cargo-msrv.
      - name: Restore cargo-msrv
        id: msrv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-msrv
          key: ${{ runner.os }}-cargo-msrv-${{ env.CARGO_MSRV_VERSION }}

      - name: Install cargo-msrv
        if: steps.msrv-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-msrv --version "${CARGO_MSRV_VERSION}" --locked

      - name: Save cargo-msrv
        if: steps.msrv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-msrv
          key: ${{ runner.os }}-cargo-msrv-${{ env.CARGO_MSRV_VERSION }}

      - name: Verify MSRV (test)
        run: cargo msrv verify -- cargo test --locked

      - name: Verify MSRV (test, serde)
        run: cargo msrv verify -- cargo test --locked --features serde

      - name: Verify MSRV (test, alloc only)
        run: cargo msrv verify -- cargo test --locked --no-default-features --features alloc

      - name: Verify MSRV (test, no default features)
        run: cargo msrv verify -- cargo test --locked --no-default-features

      - name: Verify MSRV (no_std, alloc only)
        run: >
          cargo msrv verify --target thumbv7em-none-eabi
          -- cargo build --locked --no-default-features --features alloc --target thumbv7em-none-eabi

      - name: Verify MSRV (no_std)
        run: >
          cargo msrv verify --target thumbv7em-none-eabi
          -- cargo build --locked --no-default-features --target thumbv7em-none-eabi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The Rust version is in the key: a cache restored from another version holds
          # instrumented binaries that `cargo llvm-cov clean --workspace` leaves behind, and
          # the report would count their lines as uncovered.
          key: ${{ runner.os }}-coverage-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-coverage-${{ steps.toolchain.outputs.cachekey }}-

      - name: Measure coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --locked
          cargo llvm-cov --no-report --locked --features serde
          LINES=$(cargo llvm-cov report --json --summary-only \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(round(d['data'][0]['totals']['lines']['percent'], 2))")
          echo "COVERAGE=${LINES}" >> "$GITHUB_ENV"

      - name: Check coverage
        run: |
          BASELINE=$(cat .coverage-baseline)
          echo "Coverage: ${COVERAGE}%  Baseline: ${BASELINE}%"
          python3 -c "import sys; sys.exit(0 if float('${COVERAGE}') >= float('${BASELINE}') - 0.1 else 1)" \
            || { echo "Coverage dropped below baseline"; exit 1; }

      - name: Update baseline if improved
        if: github.event_name == 'push'
        run: |
          BASELINE=$(cat .coverage-baseline)
          if awk "BEGIN { exit !(${COVERAGE} > ${BASELINE}) }"; then
            LC_NUMERIC=C printf '%.2f\n' "${COVERAGE}" > .coverage-baseline
            echo "Baseline updated: ${BASELINE} -> ${COVERAGE}"
          else
            echo "No update needed (${COVERAGE} <= ${BASELINE})"
          fi

      - name: Open PR if baseline changed
        if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ci/coverage-ratchet
          commit-message: "ci: ratchet coverage baseline to ${{ env.COVERAGE }}%"
          title: "ci: ratchet coverage baseline to ${{ env.COVERAGE }}%"
          body: |
            Coverage improved to `${{ env.COVERAGE }}%`. Updated `.coverage-baseline`.

            *Opened automatically by the coverage CI job.*
          add-paths: .coverage-baseline
